{% extends 'layouts/base.html' %}
{% load bootstrap5 %}
{% block content %}
    <div class="row d-flex mb-5 align-items-center">
        <div class="col d-flex gap-3 align-items-center">
            <h2>Log In</h2>
        </div>
    </div>
    <div class="row d-flex mb-5 gap-5 w-75 justify-content-center">
        <div class="row">
            <div class="col-3">
                <span class="input-group-text" id="tags-input">Login</span>
            </div>
            <div class="col">
                <form action="{% url 'login' %}" method="POST">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <div class="col-auto">
                        {% buttons %}
                        <button type="submit" class="btn btn-success">Log in!</button>
                        {% endbuttons %}
                    </div>
                </form>
                {% if NotFound %}
                    <div class="col-auto">
                        User with given credentials was not found!
                    </div>
                {% endif %}
            </div>
        </div>
        <div class="row">
            <div class="col-3"></div>
            <div class="col-auto">
                <a href="{% url 'signup' %}" class="">Create new account</a>
            </div>
        </div>
    </div>
{% endblock %}
