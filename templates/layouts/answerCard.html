{% block answer %}
    <div class="card mb-3 pt-2 pb-1" data-answer-id="{{ answer.id }}" style="max-width: 840px;">
        <div class="d-flex row g-0 align-items-center">
            <div class="col-md-2">
                <div class="row">
                    <img src="{{ answer.author.profile.avatar.url|default:"none.jpg" }}" class="img-fluid rounded-start" alt="None">
                </div>
                <div class="row px-3 pt-2 pb-1 gap-2 align-items-center justify-content-between">
                        <div class="col p-0 text-center">
                            {% if not request.user.is_authenticated %}
                            Likes: 
                            {% endif %}
                            <span class="likes-count">
                                {{ answer.total_count|default:0 }}
                            </span>
                        </div>
                    {% if request.user.is_authenticated %}
                    <div class="col p-0">
                        <div class="btn-group" role="group" aria-label="VoteButtons">
                            <button type="button" class="btn btn-light dislike-button">-</button>
                            <button type="button" class="btn btn-light like-button">+</button>
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
            <div class="d-flex flex-row col-md-10">
                <div class="card-body">
                    <p class="card-text">{{ answer.content }}</p>
                    <div class="d-flex align-items-center gap-1">
                        {% if request.user == question.author %}
                            <button class="btn btn-sm btn-outline-success mark-correct-button">
                                {% if answer.is_correct %}
                                    Unmark as Correct
                                {% else %}
                                    Mark as Correct
                                {% endif %}
                            </button>
                        {% endif %}
                        <span class="correct-indicator" style="{% if not answer.is_correct %}display:none;{% endif %}">
                            <i class="bi bi-check2-square"></i> Correct answer!
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
