{% load static %}
{% block navbar %}
    {% if request.user.is_authenticated %}
        <nav class="navbar navbar-expand-lg bg-body-tertiary d-flex justify-content-between sticky-top" style="background-color: #172a3a;">
            <div class="container-fluid">
                <a class="navbar-brand text-light" href="{% url 'index' %}">AskPupkin</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <form class="d-flex mx-auto w-50" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    </form>
                    <div class="d-flex gap-4 justify-content-start align-items-center">
                        <a class="btn btn-primary" href="{% url 'ask' %}" role="button">Ask</a>
                        {% if request.user.profile.avatar %}
                            <img src="{{ request.user.profile.avatar.url }}" alt="Avatar" class="rounded-circle" width="40" height="40">
                        {% else %}
                            <img src="{% static 'default.jpg' %}" alt="Default Avatar" class="rounded-circle" width="40" height="40">
                        {% endif %}
                        {#                    <img src="{{ request.user.profile.avatar.url|default:"/default.jpg"}}" alt="Avatar" class="rounded-circle" width="40" height="40">#}
                        <div>
                            <div class="text-light">
                                {{ request.user.profile.nickname }}
                            </div>
                            <a class="text-light" href="{% url 'settings' %}">Settings</a>
                            <a class="text-light" href="{% url 'logout' %}">log out</a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    {% else %}
        <nav class="navbar navbar-expand-lg bg-body-tertiary d-flex justify-content-between sticky-top" style="background-color: #172a3a;">
            <div class="container-fluid">
                <a class="navbar-brand text-light" href="{% url 'index' %}">AskPupkin</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <form class="d-flex mx-auto w-50" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    </form>
                    <div class="d-flex gap-4 justify-content-start align-items-center">
                        <a class="text-light" href="{% url 'login' %}">Log in</a>
                        <a class="text-light" href="{% url 'signup' %}">Register</a>
                    </div>
                </div>
            </div>
        </nav>
    {% endif %}
{% endblock %}
