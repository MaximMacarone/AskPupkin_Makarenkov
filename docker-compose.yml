networks:
  overlay_network:
    external: true

services:
  postgres:
    image: postgres
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_PASSWORD=maxim
      - POSTGRES_USER=maxim
    volumes:
      - ./postgresData:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - overlay_network

  django_app:
    container_name: django_app
    image: django-app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/opt/app/
    ports:
      - '8000-9000:8000'
    env_file:
      - ./env/django.env
    depends_on:
      - postgres
    links:
      - postgres
    networks:
      - overlay_network